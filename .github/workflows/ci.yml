name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 镜像已预装 .NET 10 SDK，这里显式钉住版本保证可复现
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/SnapText/SnapText.csproj -c Release

      - name: Test
        run: dotnet test tests/SnapText.Tests/SnapText.Tests.csproj -c Release

      # 三语文案键集合一致性（纯内存校验，无需桌面）。
      # 注意必须直跑构建产物：dotnet run 拉起 WinExe 时 AttachConsole 接不上输出，步骤会 0 字节
      - name: Loc check
        run: .\src\SnapText\bin\Release\net10.0-windows10.0.19041.0\SnapText.exe --loc check
